name: Build N30 Pro (validation first)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n30pro-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  SOURCE_COMMIT: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git
  PATCH_COMMIT: f8be85f26ce88f435389a112d9196a8159503ff2
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_MAXSIZE: 1G
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev python3 python3-pyelftools rsync unzip zlib1g-dev file wget curl subversion swig time libelf-dev cmake ninja-build ccache patch pkgconf xsltproc zstd gcc-multilib g++-multilib libgmp3-dev libmpc-dev libmpfr-dev libreadline-dev libtool autoconf automake autopoint cpio device-tree-compiler
      - name: Download pinned source and patch
        run: |
          git clone -b "$SOURCE_BRANCH" --single-branch "$SOURCE_REPO" openwrt
          git -C openwrt checkout "$SOURCE_COMMIT"
          git clone "$PATCH_REPO" n30pro-patch
          git -C n30pro-patch checkout "$PATCH_COMMIT"
          git -C openwrt rev-parse HEAD
          git -C n30pro-patch rev-parse HEAD
      - name: Apply device patch and proprietary Wi-Fi adaptation
        working-directory: openwrt
        run: |
          bash ../n30pro-patch/scripts/apply-netcore-n30pro.sh ../n30pro-patch
          dts=target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts
          mk=target/linux/mediatek/image/filogic.mk
          test -f "$dts"
          grep -q 'define Device/netcore_n30-pro' "$mk"
          sed -i 's/#include "mt7981b\.dtsi"/#include "mt7981.dtsi"/' "$dts"
          sed -i '/nvmem-cell-names = "eeprom";/d; /nvmem-cells = <&eeprom_factory_0>;/d' "$dts"
          if ! grep -q 'mediatek,mtd-eeprom = <&factory 0x0>;' "$dts"; then
            sed -i '/&wifi {/a\    mediatek,mtd-eeprom = <&factory 0x0>;' "$dts"
          fi
          # Remove all three open-source Wi-Fi packages independently.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("target/linux/mediatek/image/filogic.mk")
          data=p.read_text()
          start=data.find("define Device/netcore_n30-pro")
          end=data.find("endef",start)
          if start < 0 or end < 0:
              raise SystemExit("N30 Pro image definition not found")
          block=data[start:end]
          for name in ("kmod-mt7915e", "kmod-mt7981-firmware", "mt7981-wo-firmware"):
              block=block.replace(name, "")
          p.write_text(data[:start]+block+data[end:])
          print("N30 Pro DEVICE_PACKAGES:",block)
          PY
          echo "Device tree Wi-Fi excerpt:"
          grep -A8 -F '&wifi {' "$dts" || true
          if ! grep -Fq 'mediatek,mtd-eeprom = <&factory 0x0>;' "$dts"; then
            echo "::error::Missing proprietary mt_wifi EEPROM declaration"
            exit 1
          fi
          if sed -n '/define Device\/netcore_n30-pro/,/endef/p' "$mk" | grep -Eq 'kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware'; then
            echo "::error::Open-source Wi-Fi dependencies remain in N30 Pro image profile"
            exit 1
          fi
      - name: Feeds and PassWall2 sources
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/custom
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/custom/passwall2
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/custom/passwall-deps
          git -C package/custom/passwall2 rev-parse HEAD
          git -C package/custom/passwall-deps rev-parse HEAD
          git clone --depth 1 https://github.com/wyndam/luci-app-deviceid.git package/custom/luci-app-deviceid
          git -C package/custom/luci-app-deviceid rev-parse HEAD
          git clone --depth 1 --branch v3.0.0 https://github.com/jerrykuku/luci-theme-argon.git package/custom/luci-theme-argon
          git -C package/custom/luci-theme-argon rev-parse HEAD
          # Remove the old feed theme variant; keep only the 3.0.0 source.
          rm -f package/feeds/luci/luci-theme-argon
          test -f package/custom/luci-theme-argon/Makefile
          grep -q 'PKG_VERSION:=3.0.0' package/custom/luci-theme-argon/Makefile
      - name: Include N30 Pro device management package
        run: |
          cp -a packages/luci-app-n30pro-devices openwrt/package/custom/luci-app-n30pro-devices
          test -f openwrt/package/custom/luci-app-n30pro-devices/Makefile
      - name: Include clean-install Argon default
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          install -m 0755 files/etc/uci-defaults/99-n30pro-argon openwrt/files/etc/uci-defaults/99-n30pro-argon
      - name: Resolve and validate configuration
        working-directory: openwrt
        run: |
          cp defconfig/mt7981-ax3000.config .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_.*_DEVICE_/d; /^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_.*_DEVICE_/d; /^CONFIG_TARGET_mediatek_mt7981=/d' .config
          # Explicitly drop legacy bundled applications; do not delete package-manager infrastructure.
          sed -i -E '/^CONFIG_PACKAGE_(luci-app-store|luci-app-openclash|luci-app-passwall|luci-app-samba4|tailscale)=/d' .config
          # Keep MULTI_PROFILE selected: upstream defaults use this for per-device image profiles.
          printf '\nCONFIG_TARGET_MULTI_PROFILE=y\n' >> .config
          cat ../configs/n30pro.config >> .config
          make defconfig
          echo "Generated target profiles containing N30 Pro:"
          grep -Ril 'netcore_n30-pro' tmp/.targetinfo* 2>/dev/null || true
          echo "Resolved targets:"
          grep -E '^CONFIG_TARGET_(mediatek|DEVICE_mediatek|MULTI_PROFILE)' .config | head -65 || true
          echo "N30 Pro device definition:"
          sed -n '/define Device\/netcore_n30-pro/,/endef/p' target/linux/mediatek/image/filogic.mk
          for item in CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n30-pro CONFIG_PACKAGE_kmod-mt_wifi CONFIG_PACKAGE_luci-app-passwall2 CONFIG_PACKAGE_xray-core CONFIG_PACKAGE_luci-app-nlbwmon CONFIG_PACKAGE_luci-app-deviceid CONFIG_PACKAGE_luci-app-eqos-mtk CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_luci-app-n30pro-devices CONFIG_PACKAGE_sing-box; do
            grep -qx "${item}=y" .config || { echo "Missing package/target: $item"; exit 1; }
          done
          for item in CONFIG_PACKAGE_luci-app-store CONFIG_PACKAGE_luci-app-openclash CONFIG_PACKAGE_luci-app-passwall CONFIG_PACKAGE_kmod-mt7915e; do
            if grep -qx "${item}=y" .config; then echo "Forbidden package: $item"; exit 1; fi
          done
          cp .config ../resolved.config
          ./scripts/diffconfig.sh > ../diffconfig.txt
      - name: Restore source archive cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: n30pro-dl-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ hashFiles('configs/n30pro.config') }}-${{ github.run_id }}
          restore-keys: |
            n30pro-dl-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-
      - name: Restore compiler object cache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: n30pro-ccache-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ hashFiles('configs/n30pro.config') }}-${{ github.run_id }}
          restore-keys: |
            n30pro-ccache-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-
      - name: Show compiler cache configuration
        working-directory: openwrt
        run: |
          grep -qx 'CONFIG_CCACHE=y' .config || { echo "::error::OpenWrt CCACHE was not enabled"; exit 1; }
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -s || true
      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j6
          find dl -type f -size -1024c -print -delete
      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j4 2>&1 | tee ../build.log
          test ${PIPESTATUS[0]} -eq 0
          ccache -s || true
      - name: Collect images and manifest
        run: |
          mkdir -p output
          dir=openwrt/bin/targets/mediatek/filogic
          test -d "$dir"
          find "$dir" -maxdepth 1 -type f \( -iname '*n30-pro*' -o -name 'sha256sums' -o -name 'profiles.json' \) -exec cp -v {} output/ \;
          test -n "$(find output -type f -name '*sysupgrade.bin' -print -quit)"
          find "$dir" -maxdepth 1 -name '*.manifest' -exec cp -v {} output/ \;
          manifest=output/immortalwrt-mediatek-filogic.manifest
          test -f "$manifest"
          for pkg in kmod-mt_wifi luci-app-passwall2 xray-core luci-app-nlbwmon luci-app-deviceid luci-app-eqos-mtk luci-theme-argon luci-app-n30pro-devices sing-box; do
            grep -q "^${pkg} - " "$manifest" || { echo "::error::Missing image package: $pkg"; exit 1; }
          done
          for pkg in luci-app-store luci-app-openclash luci-app-passwall; do
            if grep -q "^${pkg} - " "$manifest"; then echo "::error::Forbidden image package: $pkg"; exit 1; fi
          done
          # UBI partition is 0x7280000 bytes per currently observed MTD map.
          # This is a conservative archive size guard, not a substitute for sysupgrade -T.
          python3 - <<'PY'
          from pathlib import Path
          images=list(Path('output').glob('*n30-pro*'))
          for img in images:
              print(f'IMAGE {img.name}: {img.stat().st_size} bytes')
              if img.stat().st_size > 0x7280000:
                  raise SystemExit(f'Image exceeds UBI partition: {img}')
          PY
          (cd output && sha256sum * > SHA256SUMS.txt)
      - name: Upload build artifacts (NOT flash-verified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n30pro-build-results
          path: |
            output/
            resolved.config
            diffconfig.txt
            build.log
          if-no-files-found: warn
          retention-days: 14
